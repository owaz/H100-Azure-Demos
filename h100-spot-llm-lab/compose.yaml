# Core stack on the Azure H100 VM: pinned model download -> vLLM -> LiteLLM.
# Overlays: compose.observability.yaml (telemetry), compose.ngrok.yaml (public URL).
# Every port binds to 127.0.0.1; the VM itself has no public IP.
name: llm

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    # Copied into each json-file log line's "attrs", where the collector's
    # filelog receiver reads the service name (compose.observability.yaml).
    labels-regex: '^(observability\.|com\.docker\.compose\.service$)'

services:
  # One-shot job: resolve and fetch the catalog-pinned checkpoint. The vLLM
  # image includes Python and the hf CLI.
  model-download:
    image: nvcr.io/nvidia/vllm:26.07-py3@sha256:95c498a475142c20c989c65e5d223348c09fed83ba17ddf44f117610c0bd3268
    container_name: llm-model-download
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_XET_HIGH_PERFORMANCE: "1"
      MODEL_ID: "${MODEL_ID:-qwen3.8-27b-fp8}"
      MODEL_CATALOG: /app/config/models.json
    command: ["python3", "/app/scripts/download_model.py"]
    volumes:
      - /data/models:/models
      - ./config/models.json:/app/config/models.json:ro
      - ./scripts/model_profile.py:/app/scripts/model_profile.py:ro
      - ./scripts/download_model.py:/app/scripts/download_model.py:ro
    logging: *logging
    restart: "no"

  model:
    image: local/vllm:26.07-xgrammar0.2.3
    build:
      context: images/vllm
    container_name: llm-model
    depends_on:
      model-download:
        condition: service_completed_successfully
    gpus: all
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MODEL_ID: "${MODEL_ID:-qwen3.8-27b-fp8}"
      MODEL_VM_SIZE: "${MODEL_VM_SIZE:?deploy with scripts/deploy.sh to set MODEL_VM_SIZE}"
      MODEL_CATALOG: /app/config/models.json
    volumes:
      - /data/models:/models:ro
      - /data/vllm-cache:/root/.cache/vllm
      - ./config/models.json:/app/config/models.json:ro
      - ./scripts/model_profile.py:/app/scripts/model_profile.py:ro
      - ./scripts/serve_model.py:/app/scripts/serve_model.py:ro
    command: ["python3", "/app/scripts/serve_model.py"]
    labels:
      observability.logs: "true"
      observability.service: "local-llm"
      observability.model: "${MODEL_ID:-qwen3.8-27b-fp8}"
    ports:
      - "127.0.0.1:8096:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20m
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 2m
    init: true

  litellm:
    image: ghcr.io/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
    container_name: llm-litellm
    depends_on:
      model:
        condition: service_healthy
    command:
      - --config=/app/config.yaml
      - --log_config=/app/uvicorn_logging.json
    environment:
      LITELLM_UPSTREAM_MODEL: "openai/${MODEL_ID:-qwen3.8-27b-fp8}"
      LITELLM_UPSTREAM_API_BASE: http://model:8080/v1
      LITELLM_ACTIVE_MODEL: "${MODEL_ID:-qwen3.8-27b-fp8}"
      OTEL_EXPORTER: "${LITELLM_OTEL_EXPORTER:-otlp_http}"
      OTEL_ENDPOINT: "${LITELLM_OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SERVICE_NAME: azure-litellm
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "${LITELLM_OTEL_CAPTURE_MESSAGE_CONTENT:-NO_CONTENT}"
      LITELLM_OTEL_V2: "true"
      OTEL_DEBUG: "${LITELLM_OTEL_DEBUG:-false}"
    labels:
      observability.logs: "true"
      observability.service: "litellm-gateway"
      observability.model: "${MODEL_ID:-qwen3.8-27b-fp8}"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/request_log_callback.py:/app/request_log_callback.py:ro
      - ./litellm/uvicorn_logging.json:/app/uvicorn_logging.json:ro
    ports:
      - "127.0.0.1:4000:4000"
      # docker0's address, so agent-eval task containers (scripts/eval-agent.sh)
      # can reach the gateway. Only the host and its containers see it.
      - "172.17.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *logging
    restart: unless-stopped
    init: true
