apiVersion: v1
kind: Namespace
metadata:
  name: gpu-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
  namespace: gpu-lab
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: cuda
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0@sha256:9855f4c8500addf185360474184b9efdaf4384284779aa9173dcd70164a4ae6f
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          cpu: "1"
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
